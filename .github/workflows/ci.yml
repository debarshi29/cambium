name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --frozen --group dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Type check (mypy)
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --frozen --group dev
      - name: Test
        run: uv run pytest -q -n auto --cov --cov-report=term

  pip-install:
    # The README's documented install path (pip + requirements.txt) must
    # keep working for people who don't use uv.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements.txt && pip install --no-deps -e .
      - name: CLI smoke test
        run: |
          cambium --version
          cambium tasks --split heldout
          cambium baseline --out /tmp/cambium-results

  sandbox-docker:
    # The container tier (ADR 0009). Runs the backend tests plus the full
    # sandbox hardening suite and the skill admission gate with
    # CAMBIUM_SANDBOX=docker, so both tiers face identical checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --frozen --group dev
      - name: Pull sandbox image
        run: docker pull python:3.13-slim
      - name: Test (docker tier)
        env:
          CAMBIUM_SANDBOX: docker
        run: >-
          uv run pytest -q
          tests/test_sandbox_backends.py
          tests/test_sandbox.py
          tests/test_skill_admission.py

  docker-image:
    # The reproducible-environment image builds and runs the CLI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t cambium:ci .
      - name: Smoke test
        run: |
          docker run --rm cambium:ci --version
          docker run --rm cambium:ci tasks --split heldout
          docker run --rm cambium:ci baseline --out /tmp/results
