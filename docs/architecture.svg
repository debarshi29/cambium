<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52564a"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c7a3c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="480" fill="#fbfbf7" rx="16"/>

  <!-- title -->
  <text x="24" y="34" font-size="15" font-weight="700" fill="#181b14">cambium — fixed control loop, evolving library</text>
  <text x="24" y="53" font-size="12" fill="#83866f">node sequence never changes (ADR 0001) — only each node's active prompt, and the skills retrieval can find, evolve</text>

  <!-- ================= main loop row ================= -->
  <!-- 5 nodes: plan, act, verify, reflect, extract -->
  <!-- node box helper positions -->
  <g font-size="13">
    <!-- plan -->
    <rect x="30"  y="96" width="140" height="56" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
    <text x="100" y="120" text-anchor="middle" font-weight="700" fill="#181b14">plan</text>
    <text x="100" y="137" text-anchor="middle" font-size="10.5" fill="#83866f">retrieve top_k skills</text>

    <!-- act -->
    <rect x="220" y="96" width="140" height="56" rx="10" fill="#ffffff" stroke="#52564a" stroke-width="1.6"/>
    <text x="290" y="120" text-anchor="middle" font-weight="700" fill="#181b14">act</text>
    <text x="290" y="137" text-anchor="middle" font-size="10.5" fill="#83866f">sandbox execution</text>

    <!-- verify -->
    <rect x="410" y="96" width="140" height="56" rx="10" fill="#ffffff" stroke="#52564a" stroke-width="1.6"/>
    <text x="480" y="120" text-anchor="middle" font-weight="700" fill="#181b14">verify</text>
    <text x="480" y="137" text-anchor="middle" font-size="10.5" fill="#83866f">pass / fail, timeout</text>

    <!-- reflect -->
    <rect x="600" y="96" width="140" height="56" rx="10" fill="#ffffff" stroke="#eb6834" stroke-width="1.6"/>
    <text x="670" y="120" text-anchor="middle" font-weight="700" fill="#181b14">reflect</text>
    <text x="670" y="137" text-anchor="middle" font-size="10.5" fill="#83866f">retry within budget</text>

    <!-- extract -->
    <rect x="790" y="96" width="110" height="56" rx="10" fill="#ffffff" stroke="#c98500" stroke-width="1.6"/>
    <text x="845" y="120" text-anchor="middle" font-weight="700" fill="#181b14">extract</text>
    <text x="845" y="137" text-anchor="middle" font-size="10.5" fill="#83866f">propose skill?</text>
  </g>

  <!-- forward arrows -->
  <line x1="170" y1="124" x2="216" y2="124" stroke="#52564a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="360" y1="124" x2="406" y2="124" stroke="#52564a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="550" y1="124" x2="596" y2="124" stroke="#52564a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="740" y1="124" x2="786" y2="124" stroke="#52564a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- retry loop: reflect back to act -->
  <path d="M670,96 C670,72 300,72 290,92" fill="none" stroke="#eb6834" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="480" y="70" text-anchor="middle" font-size="10" fill="#eb6834">retry (max_attempts)</text>

  <!-- solved: return to top for next task -->
  <path d="M845,152 C845,190 100,190 100,158" fill="none" stroke="#93968a" stroke-width="1.4" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
  <text x="470" y="204" text-anchor="middle" font-size="10" fill="#83866f">next task, next generation</text>

  <!-- ================= prompt nodes row ================= -->
  <g font-size="11.5">
    <rect x="30"  y="238" width="140" height="46" rx="9" fill="#e4ecdd" stroke="#4c7a3c" stroke-width="1.2"/>
    <text x="100" y="258" text-anchor="middle" font-weight="700" fill="#35592a">planner prompt</text>
    <text x="100" y="273" text-anchor="middle" font-size="10" fill="#4c7a3c">active version, node="planner"</text>

    <rect x="600" y="238" width="140" height="46" rx="9" fill="#e4ecdd" stroke="#4c7a3c" stroke-width="1.2"/>
    <text x="670" y="258" text-anchor="middle" font-weight="700" fill="#35592a">reflector prompt</text>
    <text x="670" y="273" text-anchor="middle" font-size="10" fill="#4c7a3c">active version, node="reflector"</text>

    <rect x="775" y="238" width="140" height="46" rx="9" fill="#e4ecdd" stroke="#4c7a3c" stroke-width="1.2"/>
    <text x="845" y="258" text-anchor="middle" font-weight="700" fill="#35592a">critic prompt</text>
    <text x="845" y="273" text-anchor="middle" font-size="10" fill="#4c7a3c">active version, node="critic"</text>
  </g>
  <line x1="100" y1="238" x2="100" y2="156" stroke="#4c7a3c" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowAccent)"/>
  <line x1="670" y1="238" x2="670" y2="156" stroke="#4c7a3c" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowAccent)"/>
  <line x1="845" y1="238" x2="845" y2="156" stroke="#4c7a3c" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowAccent)"/>

  <!-- ================= registries row ================= -->
  <g font-size="12.5">
    <rect x="30" y="330" width="270" height="110" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
    <text x="50" y="356" font-weight="700" fill="#181b14">Skill Registry</text>
    <text x="50" y="374" font-size="10.5" fill="#52564a">retrieval index — keyword overlap,</text>
    <text x="50" y="388" font-size="10.5" fill="#52564a">scored against task prompt text</text>
    <text x="50" y="406" font-size="10.5" fill="#52564a">admission gate — sandbox pass,</text>
    <text x="50" y="420" font-size="10.5" fill="#52564a">dedup, demonstrated reuse</text>

    <rect x="325" y="330" width="270" height="110" rx="12" fill="#ffffff" stroke="#83866f" stroke-width="1.6"/>
    <text x="345" y="356" font-weight="700" fill="#181b14">Curation</text>
    <text x="345" y="374" font-size="10.5" fill="#52564a">runs every N generations —</text>
    <text x="345" y="388" font-size="10.5" fill="#52564a">dedup, usage-decay deprecation,</text>
    <text x="345" y="402" font-size="10.5" fill="#52564a">size cap, version archiving</text>
    <text x="345" y="420" font-size="10.5" fill="#52564a">(soft-deprecate, never delete)</text>

    <rect x="620" y="330" width="270" height="110" rx="12" fill="#ffffff" stroke="#4c7a3c" stroke-width="1.6"/>
    <text x="640" y="356" font-weight="700" fill="#181b14">Prompt Registry</text>
    <text x="640" y="374" font-size="10.5" fill="#52564a">versioned per node — exactly one</text>
    <text x="640" y="388" font-size="10.5" fill="#52564a">active version each, no retrieval</text>
    <text x="640" y="406" font-size="10.5" fill="#52564a">admission gate — regression subset,</text>
    <text x="640" y="420" font-size="10.5" fill="#52564a">beats parent, dedup</text>
  </g>

  <!-- registry <-> loop connectors -->
  <path d="M100,330 C100,300 290,300 290,156" fill="none" stroke="#2a78d6" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="196" y="298" text-anchor="middle" font-size="10" fill="#2a78d6">retrieved skills</text>

  <path d="M845,152 C845,190 200,300 200,330" fill="none" stroke="#c98500" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="700" y="185" text-anchor="middle" font-size="10" fill="#c98500">admit candidate</text>

  <line x1="300" y1="385" x2="321" y2="385" stroke="#83866f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="595" y1="385" x2="616" y2="385" stroke="#83866f" stroke-width="1.3" marker-end="url(#arrow)"/>

  <text x="24" y="466" font-size="10.5" fill="#83866f">eval harness (Sprint 5) snapshots both registries at each generation checkpoint — library-off / library-on / frozen-at-N, tools-vs-prompts ablation</text>
</svg>
