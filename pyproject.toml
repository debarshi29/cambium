[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cambium"
dynamic = ["version"]
description = "A self-evolving agent whose tool/skill library and prompt library are admission-gated, retrieved, curated, and evaluated against held-out tasks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "Debarshi Chakraborty" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime dependencies only. Test/lint tooling lives in the `dev` extra /
# dependency group below -- it was briefly listed here, which made every
# downstream install of cambium pull pytest and ruff.
dependencies = [
    "mlflow-skinny>=3.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "pytest-cov>=6.0", "pytest-xdist>=3.6", "ruff>=0.6", "mypy>=1.13", "types-requests>=2.31"]

[dependency-groups]
dev = ["pytest>=9.0", "pytest-cov>=6.0", "pytest-xdist>=3.6", "ruff>=0.6", "mypy>=1.13", "types-requests>=2.31"]

[project.scripts]
cambium = "cambium.cli:main"

[project.urls]
Repository = "https://github.com/debarshi29/cambium"
Issues = "https://github.com/debarshi29/cambium/issues"

[tool.setuptools.dynamic]
version = { attr = "cambium.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cambium = ["tasks/data/*.json", "retrieval/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.13"
# The sandbox harness runs on POSIX in CI and in containers; type-check
# against that platform so its rlimit/SIGALRM paths are checked rather
# than flagged as missing on a Windows dev box.
platform = "linux"
packages = ["cambium"]
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["mlflow", "mlflow.*", "dotenv"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["cambium"]
branch = true
# Runs in the sandbox child process (every sandbox test exercises it), so
# in-process coverage can't see it.
omit = ["*/cambium/sandbox/harness_template.py"]

[tool.coverage.report]
fail_under = 88
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# generated/candidate source strings in agent/generation.py and the LLM
# prompt bodies in agent/llm_generation.py read as code to a linter but
# aren't meant to be reformatted -- excluded from the import-sort/style
# rules that would otherwise fight with deliberately-quoted string content.
ignore = ["E501"]
